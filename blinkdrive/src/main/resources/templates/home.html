<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Home</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>My Files</h1>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createDirectoryModal">
                <i class="fas fa-folder-plus"></i> New Directory
            </button>
        </div>
        
        <!-- Root directories listing -->
        <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${!directories.empty}">
            <div class="col" th:each="directory : ${directories}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title">
                                <a th:href="@{/directory/{id}(id=${directory.id})}" class="text-decoration-none">
                                    <i class="fas fa-folder text-warning"></i>
                                    <span th:text="${directory.name}">Directory</span>
                                </a>
                            </h5>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#"><i class="fas fa-edit"></i> Rename</a></li>
                                    <li><a class="dropdown-item" href="#"><i class="fas fa-trash"></i> Delete</a></li>
                                    <li><a class="dropdown-item" href="#"><i class="fas fa-share"></i> Share</a></li>
                                </ul>
                            </div>
                        </div>
                        <p class="card-text text-muted small">
                            <span th:text="${directory.formattedSize}">Size</span>
                            <span class="mx-2">|</span>
                            <span th:text="${#dates.format(directory.creationDate, 'MMM dd, yyyy')}">Date</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Empty state message -->
        <div class="text-center py-5" th:if="${directories.empty}">
            <div class="display-1 text-muted">
                <i class="fas fa-folder-open"></i>
            </div>
            <h3 class="text-muted mt-3">No directories yet</h3>
            <p class="text-muted">Click the "New Directory" button to create your first directory</p>
        </div>
        
        <!-- Create Directory Modal -->
        <div class="modal fade" id="createDirectoryModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Create New Directory</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form method="post" action="/directory/create">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="directoryName" class="form-label">Directory Name</label>
                                <input type="text" class="form-control" id="directoryName" name="directoryName" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
