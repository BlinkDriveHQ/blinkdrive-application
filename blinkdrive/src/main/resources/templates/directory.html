<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title th:text="${directory.name}">Directory</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <!-- Logic to handle parent directories -->
                <li class="breadcrumb-item active" aria-current="page" th:text="${directory.name}">Directory</li>
            </ol>
        </nav>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="${directory.name}">Directory</h1>
            <div>
                <button type="button" class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#uploadFileModal">
                    <i class="fas fa-file-upload"></i> Upload File
                </button>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createSubdirectoryModal">
                    <i class="fas fa-folder-plus"></i> New Directory
                </button>
            </div>
        </div>
        
        <!-- Subdirectories -->
        <h4 class="mb-3">Directories</h4>
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-5" th:if="${!subdirectories.empty}">
            <div class="col" th:each="subdir : ${subdirectories}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title">
                                <a th:href="@{/directory/{id}(id=${subdir.id})}" class="text-decoration-none">
                                    <i class="fas fa-folder text-warning"></i>
                                    <span th:text="${subdir.name}">Subdirectory</span>
                                </a>
                            </h5>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#"><i class="fas fa-edit"></i> Rename</a></li>
                                    <li><a class="dropdown-item" href="#"><i class="fas fa-trash"></i> Delete</a></li>
                                    <li><a class="dropdown-item" href="#"><i class="fas fa-share"></i> Share</a></li>
                                </ul>
                            </div>
                        </div>
                        <p class="card-text text-muted small">
                            <span th:text="${subdir.formattedSize}">Size</span>
                            <span class="mx-2">|</span>
                            <span th:text="${#dates.format(subdir.creationDate, 'MMM dd, yyyy')}">Date</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center py-3" th:if="${subdirectories.empty}">
            <p class="text-muted">No subdirectories in this folder</p>
        </div>
        
        <!-- Files -->
        <h4 class="mb-3">Files</h4>
        <div class="table-responsive" th:if="${!files.empty}">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Size</th>
                        <th>Type</th>
                        <th>Modified</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="file : ${files}">
                        <td>
                            <i th:class="'fas ' + ${file.iconClass} + ' me-2'"></i>
                            <span th:text="${file.name}">File name</span>
                        </td>
                        <td th:text="${file.formattedSize}">Size</td>
                        <td th:text="${file.type}">Type</td>
                        <td th:text="${#dates.format(file.lastModifiedDate, 'MMM dd, yyyy')}">Date</td>
                        <td>
                            <div class="btn-group" role="group">
                                <a th:href="@{/file/download/{id}(id=${file.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-download"></i>
                                </a>
                                <form th:action="@{/file/delete/{id}(id=${file.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="directoryId" th:value="${directory.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Are you sure you want to delete this file?')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                                <button type="button" class="btn btn-sm btn-outline-success">
                                    <i class="fas fa-share"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="text-center py-3" th:if="${files.empty}">
            <p class="text-muted">No files in this directory</p>
        </div>
        
        <!-- Upload File Modal -->
        <div class="modal fade" id="uploadFileModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Upload File</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form method="post" action="/file/upload" enctype="multipart/form-data">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="file" class="form-label">Select File</label>
                                <input type="file" class="form-control" id="file" name="file" required>
                            </div>
                            <input type="hidden" name="directoryId" th:value="${directory.id}">
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Upload</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Create Subdirectory Modal -->
        <div class="modal fade" id="createSubdirectoryModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Create New Directory</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form method="post" action="/directory/create">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="directoryName" class="form-label">Directory Name</label>
                                <input type="text" class="form-control" id="directoryName" name="directoryName" required>
                            </div>
                            <input type="hidden" name="parentDirectoryId" th:value="${directory.id}">
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
